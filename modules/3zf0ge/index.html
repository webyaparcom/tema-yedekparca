<style>
  /* sayac-kart-ikon — stats-2 tek bant, sayac-dev çerçevesiz dev rakamdır; bu modül her rakamı ayrı, ikonlu, etkileşimli bir karta koyar. */
  .modulex-sayac-kart-ikon { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-kart-ikon *, .modulex-sayac-kart-ikon *::before, .modulex-sayac-kart-ikon *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-kart-ikon :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-kart-ikon :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-kart-ikon :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-kart-ikon :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-kart-ikon img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-kart-ikon) img { height: auto; }
  .modulex-sayac-kart-ikon [hidden] { display: none !important; }
  .modulex-sayac-kart-ikon :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-kart-ikon :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-kart-ikon-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-kart-ikon-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-kart-ikon--bassiz .modulex-sayac-kart-ikon-bas { display: none; }
  .modulex-sayac-kart-ikon-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-kart-ikon-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-kart-ikon-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-kart-ikon-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-sayac-kart-ikon-ust { grid-column: 1 / -1; }
  .modulex-sayac-kart-ikon-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-kart-ikon-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-kart-ikon-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-kart-ikon-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-kart-ikon-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-kart-ikon-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-kart-ikon-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 18px; }
  .modulex-sayac-kart-ikon-kart { position: relative; display: grid; align-content: start; gap: 8px; padding: 26px; overflow: hidden; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; transition: opacity 0.6s ease, transform 0.4s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
  .modulex-sayac-kart-ikon-kart::before { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: 0; width: 48px; height: 4px; background: --accent--; transition: width 0.4s ease; }
  .modulex-sayac-kart-ikon-kart:hover { transform: translateY(-4px); border-color: --accent--; box-shadow: 0 22px 40px -30px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-sayac-kart-ikon-kart:hover::before { width: 100%; }
  .modulex-sayac-kart-ikon-kart-ust { display: flex; align-items: center; justify-content: space-between; margin-block-end: 18px; }
  .modulex-sayac-kart-ikon-ikon { display: inline-grid; place-items: center; width: 50px; height: 50px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 26px; }
  .modulex-sayac-kart-ikon-no { color: --muted--; font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-sayac-kart-ikon-sayi { font-size: clamp(2.1rem, 3.6vw, 2.9rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.05; }
  .modulex-sayac-kart-ikon-ek { color: --accentInk--; font-size: 0.6em; }
  .modulex-sayac-kart-ikon-etiket { font-size: 1.02rem; font-weight: 700; }
  .modulex-sayac-kart-ikon-not { color: --muted--; font-size: 0.92rem; }
  .modulex-sayac-kart-ikon--hazir:not(.modulex-sayac-kart-ikon--gor) .modulex-sayac-kart-ikon-kart { opacity: 0; transform: translateY(18px); }
  @media (max-width: 768px) {
    .modulex-sayac-kart-ikon-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .modulex-sayac-kart-ikon-kart { padding: 18px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kart-ikon :is(.modulex-sayac-kart-ikon-baslik, .modulex-sayac-kart-ikon-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kart-ikon-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sayac-kart-ikon-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-sayac-kart-ikon { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-kart-ikon *, .modulex-sayac-kart-ikon *::before, .modulex-sayac-kart-ikon *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-kart-ikon";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
